# x68k-stackchan CI — 実機不要のホスト側検査とファームビルド。
#
# 方針: 実行するコマンドは justfile に集約してあるので、CI は
# `nix develop -c just <task>` を呼ぶだけ。CI とローカルで同じループを回す
# (コマンド文字列の二重管理をしない)。ESP-IDF も Nix 供給なので、
# 実機ファームのビルドも devShell だけで再現できる。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # core/ が ESP32 非依存であることは本プロジェクトの開発速度の前提。
  # core/ がホストで動くから Mac 上で 68000 を走らせて Human68k をデバッグできる。
  # Nix のセットアップが要らない grep だけの検査なので、単独ジョブで速く落とす。
  #
  # grep の式は justfile の core-guard レシピと同一のものを使う。
  # Why not `just core-guard`: このジョブの狙いは「Nix を待たずに数秒で落とす」
  # ことなので、devShell の構築 (数分) を挟むと意味が無くなる。式の重複は
  # 承知のうえで、pre-commit と `just check` は justfile 側を通る。
  core-guard:
    name: core/ has no ESP32 dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # チェックアウト後に Git の認証情報は要らない。
          # 残すと後続のステップから push できてしまう。
          persist-credentials: false
      - name: Grep guard
        run: |
          set -euo pipefail
          if [ ! -d src/x68k/core ]; then
            echo "src/x68k/core/ does not exist yet; nothing to guard"
            exit 0
          fi
          if grep -rEn '^[[:space:]]*#[[:space:]]*include.*(Arduino\.h|M5Unified|M5GFX|LovyanGFX|lgfx|esp_|freertos/|driver/|soc/|sdkconfig\.h|hal/)' src/x68k/core/; then
            echo "::error::ESP32-only #include found in src/x68k/core/ (must stay ESP32-independent)"
            exit 1
          fi
          echo "core/ is ESP32-independent: OK"

  # ワークフロー自身の構文と式を検査する。lefthook の pre-commit にも置いているが、
  # あちらは staged なファイルしか見ず、hook を通さない経路 (Web UI の編集、
  # 他のツールからの push) では素通りする。CI 側を authoritative なゲートにする。
  #
  # Why not docker://rhysd/actionlint や reviewdog の action:
  #   actionlint は flake.nix の devShell が既に固定している。外部 action を足すと
  #   バージョンが二重管理になるうえ、docker:// 形式は pinact が
  #   "action can't be pinned" で弾く (SHA ピン留めの規約から外れる)。
  #   ここも他ジョブと同じく `nix develop -c just <task>` に揃える。
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # チェックアウト後に Git の認証情報は要らない。
          # 残すと後続のステップから push できてしまう。
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: false
          save: false

      - name: Lint workflows
        run: nix develop -c just actionlint

      # justfile の構文検証。pre-commit にも同じものを置いてあるが、
      # --no-verify で飛ばせるので CI でも見る。壊れると全レシピが
      # 動かなくなり、他のジョブが軒並み落ちる。
      - name: Check justfile
        run: nix develop -c just --list

  host-tests:
    name: host tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # チェックアウト後に Git の認証情報は要らない。
          # 残すと後続のステップから push できてしまう。
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      # nix store を GitHub Actions cache に載せる。
      # Why not DeterminateSystems/magic-nix-cache-action: FlakeHub Cache は
      # 有料プラン前提で、無料だと認証だけ通って読み出しが 401 になり、
      # それでもストアパスごとに書き込むためキャッシュ枠を食い潰す。
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # PR ブランチが main 用のキャッシュを汚染する経路を断つ。
          purge: false
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: nix develop -c just fmt-check

      - name: Lint (ruff)
        run: nix develop -c just lint

      # clang-tidy は compile_commands.json (= CMake configure) が要るので
      # pre-commit には置けない (コミットのたびに数十秒待たされる)。
      # その代わり CI では必ず通す。WarningsAsErrors は bugprone-* / cert-* /
      # clang-analyzer-* に絞ってあるので、落ちたら実バグの可能性が高い。
      - name: Static analysis (clang-tidy)
        run: nix develop -c just tidy

      - name: Host unit tests
        run: nix develop -c just test-host

      # ASan/UBSan は 68000 コアのメモリ破壊 (EA 計算ミスによる配列外アクセス、
      # 符号付きオーバーフロー) を捕まえる。エミュレータでは通常テストより効く。
      - name: Host tests with sanitizers
        run: nix develop -c just test-san

  # 68000 の適合性テスト。
  #
  # SingleStepTests のベクタ (132MB) を取得して回す。他のジョブより時間が
  # かかるので独立させ、失敗しても何が壊れたか分かるようにしている。
  #
  # Why not host-tests に含めるか: ベクタの取得だけで数十秒かかり、
  # フォーマットや lint の結果を見るまでの時間が延びる。CPU の適合性は
  # 独立した関心事なので、ジョブも分ける。
  cpu-vectors:
    name: 68000 conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # チェックアウト後に Git の認証情報は要らない。
          # 残すと後続のステップから push できてしまう。
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: false
          save: false

      # ベクタは upstream の git リポジトリ。内容は不変なので、
      # 一度取れば以後はキャッシュから復元できる。
      # gitleaks が `key: <値>` を汎用 API キーと誤検知するため、
      # 値を式で組み立てて素の文字列にしない。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ProcessorTests
          key: ${{ format('m68k-vectors-{0}', 'v1') }}

      - name: Fetch test vectors
        run: nix develop -c just fetch-tests

      - name: Run conformance vectors
        run: nix develop -c just test-vectors

  firmware-build:
    name: ESP-IDF firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # チェックアウト後に Git の認証情報は要らない。
          # 残すと後続のステップから push できてしまう。
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-idf-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-idf-${{ runner.os }}-
          purge: false
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Build firmware
        run: nix develop -c just build

      # .iram0 / .dram0 の overflow はリンク時にしか分からず、しかも「あと少しで
      # 溢れる」状態は気付きにくい。68000 のホット命令を IRAM_ATTR に足すたびに
      # ここで残量を確認できるようにする。
      - name: Size report
        run: nix develop -c just size
