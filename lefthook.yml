# x68k-stackchan の git hook 定義 (lefthook)。
# hook の登録は flake.nix の shellHook が `lefthook install` で行うので、
# clone 後に手動セットアップは不要 (devShell に入れば有効になる)。
#
# 方針: pre-commit は「速い検査」だけに絞る。clang-tidy のように
# compile_commands.json の生成 (= CMake configure) が要るものは CI と
# `just tidy` に置く。コミットのたびに数十秒待たされると hook を外したくなる。
#
# 各コマンドを `nix develop -c` で包んでいるのは、git hook が devShell の外の
# シェル (エディタの Git 統合や、direnv を通していない端末) から起動されても
# 動くようにするため。包まないと clang-format / ruff が PATH に無く
# "command not found" で落ちる。devShell に入っている場合は既に評価済みの
# 環境が再利用されるので、追加のコストはほとんどない。

pre-commit:
  parallel: true
  commands:
    # core/ が ESP32 非依存であることは本プロジェクトの開発速度の前提
    # (Mac 上で 68000 を走らせて Human68k をデバッグする)。CI でも見るが、
    # 手元で即座に気付けるようコミット時にも検査する。
    core-guard:
      glob: "src/x68k/core/**/*.{c,h,cpp,hpp}"
      run: nix develop -c just core-guard

    clang-format:
      glob: "*.{c,h,cpp,hpp}"
      exclude:
        - "test/doctest/*"
      run: nix develop -c clang-format --dry-run --Werror {staged_files}

    ruff-format:
      glob: "*.py"
      run: nix develop -c ruff format --check {staged_files}

    ruff-check:
      glob: "*.py"
      run: nix develop -c ruff check {staged_files}

    # pre-commit の gitleaks はあくまで tripwire。全履歴を見る CI 側が
    # authoritative なゲート。
    # justfile の構文検証。
    #
    # [doc(...)] 属性とレシピの間にコメントを挟むと just が解釈できず、
    # 全レシピが動かなくなる。ビルドも CI も一斉に落ちるのに、
    # 編集した本人は気付きにくい (実際に 2 度やった)。
    # --list は構文エラーを非ゼロで返すので、これで止まる。
    justfile:
      glob: "justfile"
      run: nix develop -c just --list

    # 「IPL-ROM を逆アセンブルして確かめた」という主張の検査。
    #
    # lint は ROM が要らないので常時走らせる。番地を根拠に書いたのに生ワード列を
    # 付けなかったコミットを、その場で数として見せる (ラチェットは CI 側)。
    verify-rom-lint:
      glob: "{src/x68k/core/**/*.h,docs/knowledge/*.md}"
      run: nix develop -c uv run tools/verify_iplrom.py lint --quiet

    # check は ROM (rom/iplrom.dat) がある人だけ走る。
    #
    # 終了コード 3 = ROM が無い、4 = 既知でない ROM。どちらも「照合できなかった」
    # のであって「主張が誤っている」ではないので、コミットは止めない。
    # 1 (MISMATCH) だけを失敗として扱う。
    #
    # Why not ROM が無いときに黙って成功しないか: スクリプトは SKIPPED を必ず
    # 出力する。何も出さずに通ると「照合した」と見分けがつかず、ROM を置き忘れた
    # まま「検証済み」と思い込む経路ができる。
    verify-rom-check:
      glob: "{src/x68k/core/**/*.h,docs/knowledge/*.md}"
      run: |
        code=0
        nix develop -c uv run tools/verify_iplrom.py check || code=$?
        if [ "$code" -eq 3 ] || [ "$code" -eq 4 ]; then exit 0; fi
        exit "$code"

    gitleaks:
      run: nix develop -c gitleaks git --staged --no-banner --redact

    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: nix develop -c actionlint {staged_files}

    # `-fix=false -no-api` は pinact のオフライン形。uses: が 40 桁 SHA かだけを
    # 見て GitHub API を叩かないので、ネットワーク無しでも速く動く。
    # 注意: SHA の「形式」しか見ないので、実在しない SHA は素通りする。
    # 新しい SHA の解決は `just pin`。
    pinact:
      glob: ".github/workflows/*.{yml,yaml}"
      run: nix develop -c pinact run -fix=false -no-api {staged_files}
